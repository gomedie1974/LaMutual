<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Pagos Mutual</title>
    <link rel="shortcut icon" href="../image/Logo Asociacion Mutual.JPG">    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #003366; --secondary: #6c757d; --bg: #f8f9fa; --success: #28a745; --bank: #e3f2fd; --danger: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: #333; padding: 10px; margin: 0; }
        .container { max-width: 1000px; margin: 10px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Encabezado en una sola línea */
        .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 15px; }
        .header-left, .header-right { flex: 1; display: flex; }
        .header-left { justify-content: flex-start; }
        .header-right { justify-content: flex-end; }
        .header-logo { height: 50px; width: auto; object-fit: contain; }
        
        h2 { color: var(--primary); margin: 0; text-align: center; flex: 2; font-size: 1.5rem; }
        
        .btn-reset { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; transition: all 0.3s; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8em; }
        .btn-reset:hover { background-color: var(--danger); color: white; transform: scale(1.05); }

        p.subtitle { text-align: center; color: var(--secondary); margin-top: -10px; margin-bottom: 20px; font-size: 0.9em; }
        
        .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: #eef2f7; padding: 15px; border-radius: 8px; border-left: 5px solid var(--primary); }
        .card span { display: block; font-size: 0.8em; color: var(--secondary); }
        .card strong { font-size: 1.2em; color: var(--primary); }
        .card.deuda-viva { border-left-color: var(--danger); background: #fff5f5; }

        .inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; background: #fff; padding: 15px; border: 1px solid #ddd; border-top-left-radius: 8px; border-top-right-radius: 8px; align-items: flex-end; }
        
        .bank-panel { display: flex; flex-wrap: wrap; background: var(--bank); padding: 15px; border: 1px solid #bbdefb; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; margin-bottom: 30px; align-items: center; justify-content: flex-start; gap: 30px; }
        
        .group { display: flex; flex-direction: column; min-width: 120px; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.85em; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; width: 100%; box-sizing: border-box; }

        /* Estilo para conceptos editables en la tabla */
        .input-concepto { border: none; background: transparent; font-family: inherit; font-size: inherit; font-weight: bold; color: inherit; width: 100%; outline: none; padding: 2px; border-radius: 4px; }
        .input-concepto:hover { background: rgba(0,0,0,0.05); }
        .input-concepto:focus { background: white; box-shadow: 0 0 0 1px #ccc; }

        .table-wrapper { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; min-width: 600px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; }
        tr.pagado { background-color: #e8f5e9 !important; color: #2e7d32; }
        
        .btn-pay { background: white; border: 1px solid var(--success); color: var(--success); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; max-width: 100px; }
        .btn-pay.active { background: var(--success); color: white; }
        .btn-print { background-color: var(--success); color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; height: 44px; width: 100%; }

        @media (max-width: 600px) {
            .header-container { flex-direction: column; text-align: center; }
            .header-left, .header-right { justify-content: center; }
            .bank-panel { flex-direction: column; align-items: flex-start; gap: 15px; }
        }

        @media print {
            .inputs, .btn-print, .btn-pay, .btn-reset, #statusSync { display: none !important; }
            tr.pagado { background-color: #e8f5e9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; border: 2px solid #2e7d32 !important; }
            .solo-print { display: inline-block !important; font-weight: bold; color: #2e7d32; margin-left: 10px; }
            .input-concepto { font-weight: bold; }
        }
        .solo-print { display: none; }
        #statusSync { font-size: 0.75em; color: var(--success); font-weight: bold; margin-left: auto; font-variant: small-caps; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <div class="header-left">
            <img src="../image/Logo Asociacion Mutual.JPG" alt="Logo" class="header-logo">
        </div>
        <h2>Plan de Pagos: La Nación</h2>
        <div class="header-right">
            <button class="btn-reset" onclick="resetearTodo()">Reiniciar Plan</button>
        </div>
    </div>
    <p class="subtitle">Mutual del Diario La Nación - Deuda Consolidada</p>

    <div class="summary-cards">
        <div class="card">
            <span>Deuda Original</span>
            <strong>$ 27.784.837,27</strong>
            <div style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ccc; font-size: 0.8em;">
                <div style="display: flex; justify-content: space-between;">
                    <span>Galeno:</span><span style="font-weight: bold;">$ 24.564.272,22</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span>Circulación:</span><span style="font-weight: bold;">$ 3.220.565,05</span>
                </div>
            </div>
        </div>
        <div class="card deuda-viva"><span>Pendiente Actual</span><strong id="saldoPendienteReal">$ 0,00</strong></div>
        <div class="card"><span>Total Cobrado</span><strong id="totalPagado">$ 0,00</strong></div>
    </div>

    <div class="inputs">
        <div class="group"><label>Adelanto Pesos ($)</label><input type="text" id="adelantoDisplay" oninput="manejarMoneda(this, 'adelanto')"></div>
        <div class="group"><label>Monto USD</label><input type="number" id="montoUSD" oninput="guardar()"></div>
        <div class="group"><label>Cotización</label><input type="number" id="cotizacionUSD" oninput="guardar()"></div>
        <div class="group"><label>Cuotas</label><input type="number" id="cuotas" min="1" oninput="guardar()"></div>
        <div class="group"><button class="btn-print" onclick="window.print()">Imprimir</button></div>
    </div>

    <div class="bank-panel">
        <div class="group" style="flex-direction: row; align-items: center; gap: 15px;">
            <label id="labelBanco" style="white-space:nowrap">Saldo en Banco:</label>
            <input type="text" id="saldoBancoDisplay" style="width: 180px; font-weight: bold;" oninput="manejarMoneda(this, 'banco')">
        </div> 
        <div class="group" style="flex-direction: row; align-items: center; gap: 15px;">
            <label style="white-space:nowrap">Aguinaldo:</label>
            <input type="text" id="aguinaldoDisplay" style="width: 180px; font-weight: bold;" oninput="manejarMoneda(this, 'aguinaldo')">
        </div>
        <div id="statusSync">☁ Sincronizado</div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead><tr><th>Cuota</th><th>Concepto (Editable)</th><th>Fecha Pago</th><th>Monto</th><th>Estado</th></tr></thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC1nSg8R6qY_rt0y4A5Cjd6Ipl3kPAiqf8",
        authDomain: "mutual-pagos-2895f.firebaseapp.com",
        databaseURL: "https://mutual-pagos-2895f-default-rtdb.firebaseio.com/", 
        projectId: "mutual-pagos-2895f",
        storageBucket: "mutual-pagos-2895f.firebasestorage.app",
        messagingSenderId: "1003553822362",
        appId: "1:1003553822362:web:d0f23c4678dbeb98643123"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const dbRef = db.ref("mutual/planUnico");

    const DEUDA_TOTAL = 27784837.27;
    let datos = { adelantoP: 0, mUSD: 0, cUSD: 0, cuotas: 12, sBanco: 0, sAguinaldo: 0, pagos: {}, fechas: {}, conceptosCustom: {} };
    const fmt = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' });

    window.onload = () => {
        const hoy = new Date().toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        document.getElementById('labelBanco').innerText = `Saldo en Banco al ${hoy}:`;
    };

    dbRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
            datos = val;
            if (!datos.pagos) datos.pagos = {};
            if (!datos.fechas) datos.fechas = {};
            if (!datos.conceptosCustom) datos.conceptosCustom = {};
            dibujarUI();
        }
    });

    function dibujarUI() {
        document.getElementById('montoUSD').value = datos.mUSD || "";
        document.getElementById('cotizacionUSD').value = datos.cUSD || "";
        document.getElementById('cuotas').value = datos.cuotas || 12;
        document.getElementById('adelantoDisplay').value = fmt.format(datos.adelantoP || 0);
        document.getElementById('saldoBancoDisplay').value = fmt.format(datos.sBanco || 0);
        document.getElementById('aguinaldoDisplay').value = fmt.format(datos.sAguinaldo || 0);
        
        const cuerpo = document.getElementById('cuerpoTabla');
        cuerpo.innerHTML = "";
        let totalP = 0;
        let adelantoT = (datos.adelantoP || 0) + ((datos.mUSD || 0) * (datos.cUSD || 0));

        if (adelantoT > 0) {
            if(datos.pagos['adelanto']) totalP += adelantoT;
            let conceptoAdelanto = (datos.conceptosCustom['adelanto']) || "Adelanto Inicial";
            if (datos.mUSD > 0 && !datos.conceptosCustom['adelanto']) {
                conceptoAdelanto += ` (Incluye U$D ${datos.mUSD} a $${datos.cUSD})`;
            }
            cuerpo.innerHTML += renderFila('adelanto', conceptoAdelanto, adelantoT);
        }

        let mCuota = Math.max(0, DEUDA_TOTAL - adelantoT) / (datos.cuotas || 1);
        for (let i = 1; i <= (datos.cuotas || 12); i++) {
            if(datos.pagos[i]) totalP += mCuota;
            let desc = datos.conceptosCustom[i] || `Cuota Mensual ${i}`;
            cuerpo.innerHTML += renderFila(i, desc, mCuota);
        }

        document.getElementById('totalPagado').innerText = fmt.format(totalP);
        document.getElementById('saldoPendienteReal').innerText = fmt.format(DEUDA_TOTAL - totalP);
    }

    function renderFila(id, desc, monto) {
        const ok = datos.pagos && datos.pagos[id];
        const etiquetaImpresion = ok ? '<span class="solo-print"> [Pagado!]</span>' : '';
        
        return `<tr class="${ok ? 'pagado' : ''}">
            <td>${id === 'adelanto' ? '-' : id}</td>
            <td>
                <input type="text" value="${desc}" 
                    onchange="updateConcepto('${id}', this.value)" 
                    class="input-concepto">
                ${etiquetaImpresion}
            </td>
            <td><input type="date" value="${datos.fechas[id] || ''}" onchange="updateFecha('${id}', this.value)" style="border:none; background:transparent; font-family: inherit; width: 140px;"></td>
            <td style="font-weight: bold;">${fmt.format(monto)}</td>
            <td><button class="btn-pay ${ok ? 'active' : ''}" onclick="togglePago('${id}')">${ok ? 'Pagado!' : 'Impago'}</button></td>
        </tr>`;
    }

    function manejarMoneda(input, tipo) {
        let v = parseFloat(input.value.replace(/\D/g, "")) / 100 || 0;
        if (tipo === 'adelanto') datos.adelantoP = v;
        else if (tipo === 'banco') datos.sBanco = v;
        else if (tipo === 'aguinaldo') datos.sAguinaldo = v;
        input.value = fmt.format(v);
        guardar();
    }

    function togglePago(id) {
        if (!datos.pagos) datos.pagos = {};
        datos.pagos[id] = !datos.pagos[id];
        guardar();
    }

    function updateFecha(id, f) {
        if (!datos.fechas) datos.fechas = {};
        datos.fechas[id] = f;
        guardar();
    }

    function updateConcepto(id, txt) {
        if (!datos.conceptosCustom) datos.conceptosCustom = {};
        datos.conceptosCustom[id] = txt;
        guardar();
    }

    function guardar() {
        document.getElementById('statusSync').innerText = "☁ Guardando...";
        datos.mUSD = parseFloat(document.getElementById('montoUSD').value) || 0;
        datos.cUSD = parseFloat(document.getElementById('cotizacionUSD').value) || 0;
        datos.cuotas = parseInt(document.getElementById('cuotas').value) || 12;
        dbRef.set(datos).then(() => {
            document.getElementById('statusSync').innerText = "☁ Sincronizado";
        }).catch(e => console.error("Error guardando:", e));
    }

    function resetearTodo() {
        if(confirm("¿Reiniciar plan? Se borrarán pagos, fechas y conceptos editados.")) {
            dbRef.set({ adelantoP:0, mUSD:0, cUSD:0, cuotas:12, sBanco:0, sAguinaldo:0, pagos:{}, fechas:{}, conceptosCustom:{} });
        }
    }
</script>
</body>
</html>
