<html lang="es">
<head>

  <style>
    .codigo-grid {

<body style="background-color: rgb(245, 235, 223);">
  <header class="p-3 text-black" style="background-color: rgb(225, 225, 225);">
    <div style="float:right;">
      <script>
        let today = new Date();
        let m = today.getMonth() + 1;
        let mes = (m < 10) ? "0" + m : m;
        document.write(today.getDate(), "/" + mes, "/", today.getFullYear());
      </script>
    </div>
    <span id="reloj" style="float: left;"></span>
    <script>
      function mostrarHora() {
        let fecha = new Date();
        let horas = fecha.getHours();
        let minutos = fecha.getMinutes();
        let segundos = fecha.getSeconds();
        let ampm = horas >= 12 ? 'pm' : 'am';
        horas = horas % 12 || 12;
        minutos = minutos < 10 ? '0' + minutos : minutos;
        segundos = segundos < 10 ? '0' + segundos : segundos;
        document.getElementById('reloj').innerHTML =
          horas + ':' + minutos + ':' + segundos + ' ' + ampm;
      }
      setInterval(mostrarHora, 1000);
    </script>

    <div class="container text-center">
      <img src="../image/logosinfondo.png" width="150" alt="">
    </div>
    <div id="header" class="d-flex justify-content-end">
      <a href="../index.html" style="margin-right: 2%;"><b>Home</b></a>
    </div>
  </header>

  <div class="container text-center mt-4">
    <h3><u>Estacionamiento</u></h3>
    <h3><u>Generador de Códigos QR</u></h3><br>

    <p><b>Socios: $ 2.000,00*</b> |
      <span style="color: red;"><b>No socios: $ 3.100,00*</b></span>
    </p>

     <form class="row g-3 justify-content-center">

    <!-- Nombre y Vehículo en la misma línea -->
    <div class="col-md-5">
      <label for="nombre" class="form-label">Nombre y Apellido:</label>

      <datalist id="listaNombres"></datalist>
    </div>

    <div class="col-md-5">
      <label for="vehiculo" class="form-label">Marca vehículo:</label>

    </div>

    <!-- Patente y Cantidad en otra línea -->

      <label for="patente" class="form-label">Nro. Patente:</label>

    </div>

    <!-- Botones -->
  <div class="col-12 text-center mt-3 d-flex justify-content-center gap-2">
    <button id="generar-btn" class="btn btn-primary" type="button" onclick="generarCodigosQR()">Generar QR</button>
    
    <button id="imprimir-btn" class="btn btn-primary" type="button" onclick="imprimirCodigosQR()">Imprimir QR</button>
   
  </div>
   <!-- Botones -->
  <div class="col-12 text-center mt-3 d-flex justify-content-center gap-2">
    <button class="btn btn-warning" type="button" data-bs-toggle="modal" data-bs-target="#modalNuevoSocio">
      Agregar socio
    </button>
    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalModificarSocio">
      Modificar socio
    </button>
    <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalEliminarSocio">
      Eliminar socio
    </button>
  </div>

  </form>

    <div id="codigos" class="codigo-grid mt-4"></div>
  </div>

  <script>
    let socios = [];

    // 🔄 Cargar datos desde sociosestacionamiento.csv
    async function cargarSocios() {
      try {
        const respuesta = await fetch("sociosestacionamiento.csv?nocache=" + Date.now());

        const texto = await respuesta.text();

        const filas = texto.trim().split("\n").slice(1);
        socios = filas.map(fila => {
          const [nombre, vehiculo, patente] = fila.split(",");
          return { nombre, vehiculo, patente };
        });

        // Agregar nombres al datalist
        const lista = document.getElementById("listaNombres");
        lista.innerHTML = ""; // <-- Limpia la lista antes de llenarla

        socios.forEach(s => {
          const option = document.createElement("option");
          option.value = s.nombre;
          lista.appendChild(option);
        });

      } catch (error) {
        console.error("Error al cargar sociosestacionamiento.csv:", error);
      }
    }

    // Ejecutar al cargar la página
    window.onload = cargarSocios;

    // 🔍 Autocompletar datos al escribir nombre
    const inputNombre = document.getElementById("nombre");
    inputNombre.addEventListener("input", () => {
      const socioEncontrado = socios.find(s => s.nombre.toLowerCase() === inputNombre.value.toLowerCase());
      if (socioEncontrado) {
        document.getElementById("vehiculo").value = socioEncontrado.vehiculo;
        document.getElementById("patente").value = socioEncontrado.patente;
      } else {
        document.getElementById("vehiculo").value = "";
        document.getElementById("patente").value = "";
      }
    });
   </script>
  <script src="../estacionamiento.js"></script> 

  <script>
function guardarNuevoSocio() {
  const nombre = document.getElementById("nuevoNombre").value.trim();
  const vehiculo = document.getElementById("nuevoVehiculo").value.trim();
  const patente = document.getElementById("nuevoPatente").value.trim();

  if (!nombre || !vehiculo || !patente) {
    alert("Completa todos los campos.");
    return;
  }

  fetch("agregar_socio.php", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `nombre=${encodeURIComponent(nombre)}&vehiculo=${encodeURIComponent(vehiculo)}&patente=${encodeURIComponent(patente)}`
  })
  .then(r => r.text())
  .then(resp => {
    alert(resp);

    // Cerrar modal
    const modal = bootstrap.Modal.getInstance(document.getElementById('modalNuevoSocio'));
    modal.hide();

    // Limpiar campos
    document.getElementById("nuevoNombre").value = "";
    document.getElementById("nuevoVehiculo").value = "";
    document.getElementById("nuevoPatente").value = "";

    // Recargar lista de socios
    cargarSocios();
  });
}
</script>

<div class="modal fade" id="modalEliminarSocio" tabindex="-1">

      <div class="modal-header">
        <h5 class="modal-title">Eliminar socio</h5>

      </div>

      <div class="modal-body">
        <p><b>Seleccioná el socio que querés eliminar:</b></p>

          <label class="form-label">Vehículo</label>

        <p class="text-danger mt-3"><b>Esta acción no se puede deshacer.</b></p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-danger" onclick="eliminarSocio()">Eliminar</button>
      </div>

    </div>
  </div>

<script>
// Cargar info al escribir nombre
document.getElementById("delNombre").addEventListener("input", () => {
  const nombre = document.getElementById("delNombre").value.trim().toLowerCase();
  const socio = socios.find(s => s.nombre.toLowerCase() === nombre);

  if (socio) {
    document.getElementById("delVehiculo").value = socio.vehiculo;
    document.getElementById("delPatente").value = socio.patente;
  } else {
    document.getElementById("delVehiculo").value = "";
    document.getElementById("delPatente").value = "";
  }
});

function eliminarSocio() {
  const nombre = document.getElementById("delNombre").value.trim();

  if (!nombre) {
    alert("Escribí el nombre de un socio válido.");
    return;
  }

  if (!confirm(`¿Seguro que querés eliminar a ${nombre}?`)) return;

  fetch("eliminar_socio.php", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `nombre=${encodeURIComponent(nombre)}`
  })
  .then(r => r.text())
  .then(resp => {
    alert(resp);

    // Cerrar modal
    const modal = bootstrap.Modal.getInstance(document.getElementById('modalEliminarSocio'));
    modal.hide();

    // Recargar lista
    cargarSocios();
  });
}
</script>
