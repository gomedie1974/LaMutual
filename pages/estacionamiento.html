<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Códigos QR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>

  <style>
    .codigo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 20px;
    }
    .codigo-qr-container {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
      background-color: white;
    }
    datalist option {
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body style="background-color: rgb(245, 235, 223);">
  <header class="p-3 text-black" style="background-color: rgb(225, 225, 225);">
    <div style="float:right;">
      <script>
        let today = new Date();
        let m = today.getMonth() + 1;
        let mes = (m < 10) ? "0" + m : m;
        document.write(today.getDate(), "/" + mes, "/", today.getFullYear());
      </script>
    </div>
    <span id="reloj" style="float: left;"></span>
    <script>
      function mostrarHora() {
        let fecha = new Date();
        let horas = fecha.getHours();
        let minutos = fecha.getMinutes();
        let segundos = fecha.getSeconds();
        let ampm = horas >= 12 ? 'pm' : 'am';
        horas = horas % 12 || 12;
        minutos = minutos < 10 ? '0' + minutos : minutos;
        segundos = segundos < 10 ? '0' + segundos : segundos;
        document.getElementById('reloj').innerHTML =
          horas + ':' + minutos + ':' + segundos + ' ' + ampm;
      }
      setInterval(mostrarHora, 1000);
    </script>

    <div class="container text-center">
      <img src="../image/logosinfondo.png" width="150" alt="">
    </div>
    <div id="header" class="d-flex justify-content-end">
      <a href="../index.html" style="margin-right: 2%;"><b>Home</b></a>
    </div>
  </header>

  <div class="container text-center mt-4">
    <h3><u>Estacionamiento</u></h3>
    <h3><u>Generador de Códigos QR</u></h3><br>

    <p><b>Socios: $ 1.800,00*</b> |
      <span style="color: red;"><b>No socios: $ 2.800,00*</b></span>
    </p>

     <form class="row g-3 justify-content-center">

    <!-- Nombre y Vehículo en la misma línea -->
    <div class="col-md-5">
      <label for="nombre" class="form-label">Nombre y Apellido:</label>
      <input list="listaNombres" class="form-control" id="nombre" placeholder="Escribí un nombre...">
      <datalist id="listaNombres"></datalist>
    </div>

    <div class="col-md-5">
      <label for="vehiculo" class="form-label">Marca vehículo:</label>
      <input type="text" class="form-control" id="vehiculo" placeholder="Ej: Toyota">
    </div>

    <!-- Patente y Cantidad en otra línea -->
    <div class="col-md-3">
      <label for="patente" class="form-label">Nro. Patente:</label>
      <input type="text" class="form-control" id="patente" style="width: 100px;" placeholder="ABC123">
    </div>

    <div class="col-md-3">
      <label for="cantidad" class="form-label">Cantidad códigos QR:</label>
      <input type="number" class="form-control" id="cantidad" value="1" min="1" style="width: 80px;">
    </div>

    <!-- Botones -->
    <div class="col-12 text-center mt-3">
      <button id="generar-btn" class="btn btn-primary" type="button" onclick="generarCodigosQR()">Generar Códigos QR</button>
      <button id="imprimir-btn" class="btn btn-secondary" type="button" onclick="imprimirCodigosQR()">Imprimir Códigos QR</button>
    </div>

  </form>

    <div id="codigos" class="codigo-grid mt-4"></div>
  </div>

  <script>
    let socios = [];

    // 🔄 Cargar datos desde sociosestacionamiento.csv
    async function cargarSocios() {
      try {
        const respuesta = await fetch("sociosestacionamiento.csv");
        const texto = await respuesta.text();

        const filas = texto.trim().split("\n").slice(1);
        socios = filas.map(fila => {
          const [nombre, vehiculo, patente] = fila.split(",");
          return { nombre, vehiculo, patente };
        });

        // Agregar nombres al datalist
        const lista = document.getElementById("listaNombres");
        socios.forEach(s => {
          const option = document.createElement("option");
          option.value = s.nombre;
          lista.appendChild(option);
        });
      } catch (error) {
        console.error("Error al cargar sociosestacionamiento.csv:", error);
      }
    }

    // Ejecutar al cargar la página
    window.onload = cargarSocios;

    // 🔍 Autocompletar datos al escribir nombre
    const inputNombre = document.getElementById("nombre");
    inputNombre.addEventListener("input", () => {
      const socioEncontrado = socios.find(s => s.nombre.toLowerCase() === inputNombre.value.toLowerCase());
      if (socioEncontrado) {
        document.getElementById("vehiculo").value = socioEncontrado.vehiculo;
        document.getElementById("patente").value = socioEncontrado.patente;
      } else {
        document.getElementById("vehiculo").value = "";
        document.getElementById("patente").value = "";
      }
    });

   </script>
  <script src="../estacionamiento.js"></script> 
</body>
</html>
