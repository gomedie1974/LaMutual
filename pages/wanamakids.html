    /* Filtros Sticky */
    .filtros-full {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: white;
      width: 100%;

      border-bottom: 3px solid #0a66c2;

    .categoria-title {

      color: #04356c;
      margin-top: 50px;
      border-left: 6px solid #0a66c2;
      padding-left: 12px;
      margin-bottom: 25px;
    }

    /* Cards Estilizadas */
    .card {
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      transition: transform .3s;
      border: 1px solid rgba(0,0,0,0.08);
      background: white;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    
    .img-container { position: relative; width: 100%; height: 280px; overflow: hidden; }
    .card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

    .badge-discount {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: #ff6b6b;
      color: white;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 6px;
      z-index: 10;
    }

    .precio-no-socio { color: #6c757d; text-decoration: line-through; font-size: 0.85rem; }
    .precio-socio { color: #0a66c2; font-weight: bold; font-size: 1.1rem; line-height: 1.2; }

    /* Botón WhatsApp */
    .btn-whatsapp-card {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #25d366;
      color: white;
      text-decoration: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 12px;
      transition: 0.3s;
    }
    .btn-whatsapp-card:hover { background-color: #128c7e; color: white; }
    .btn-whatsapp-card i { margin-right: 6px; }

    /* Utilidades */
    .ir-arriba {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #0a66c2;
      color: white;
      border-radius: 50%;
      padding: 10px 15px;
      font-size: 1.5rem;
      cursor: pointer;
      display: none;
      z-index: 1000;
    }

    .lightbox {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.9);
      display:none; justify-content:center; align-items:center;
      z-index: 2000; cursor: pointer;
    }
    .lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }

    function renderTienda() {
      const categorias = ["accesorios", "camisas", "campera", "pantalon", "remeras"];
      categorias.forEach(cat => {
        const contenedor = document.querySelector(`#${cat} .row`);
        const filtrados = productos.filter(p => p.cat === cat);
        
        contenedor.innerHTML = filtrados.map(p => `
          <div class="col-6 col-md-4 col-lg-3">
            <div class="card shadow-sm">
              <span class="badge-discount">40% OFF</span>
              <div class="img-container">
                <img src="${p.img}" onclick="openZoom('${p.img}')" loading="lazy">
              </div>
              <div class="card-body p-2 p-md-3">
                <h6 class="card-title fw-bold mb-1" style="font-size: 0.9rem;">${p.nom}</h6>
                <p class="text-muted mb-2" style="font-size: 0.8rem;">Col: ${p.col} ${p.tall ? '<br>Talles: '+p.tall : ''}</p>
                <div class="precio-no-socio">$ ${p.pNo}</div>
                <div class="precio-socio">$ ${p.pSo}</div>
                <small class="text-secondary" style="font-size: 0.7rem;">${p.cuo}</small>
                <a href="https://api.whatsapp.com/send?phone=5491139546021&text=Hola!%20Me%20interesa:%20${encodeURIComponent(p.nom + ' ' + p.col)}" 
                   target="_blank" class="btn-whatsapp-card">
                  <i class="bi bi-whatsapp"></i> Consultar
                </a>
              </div>
            </div>
          </div>
        `).join('');
      });
    }

    function openZoom(s) { 
      const l = document.getElementById('lightbox');
      l.querySelector('img').src = s;
      l.style.display = 'flex';
    }

    // Loaders
    fetch("navbar.html").then(r => r.text()).then(d => document.getElementById("navbar").innerHTML = d);
    fetch("footer.html").then(r => r.text()).then(d => document.getElementById("footer").innerHTML = d);

    window.onscroll = () => document.getElementById('irArriba').style.display = window.scrollY > 400 ? 'block' : 'none';
    document.getElementById('irArriba').onclick = () => window.scrollTo({top:0, behavior:'smooth'});

    document.addEventListener('DOMContentLoaded', renderTienda);
