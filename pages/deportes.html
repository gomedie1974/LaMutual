    <!-- Estilos CSS -->
    <style>
      .img-banner {
        width: 100%; /* Ancho completo */
        height: 250px; /* Altura fija para que se vea como un banner */
        object-fit: cover; /* Recorta la imagen manteniendo sus proporciones */
      }

      .button-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        gap: 10px; /* Espacio entre los botones */
        flex-wrap: wrap; /* Para que los botones se apilen en pantallas pequeñas */
        justify-content: center; /* Centra los botones horizontalmente */

      }
    
      .button-container button {
        flex: 1;
        min-width: 150px; /* Tamaño mínimo de los botones */
        max-width: 300px; /* Para evitar que los botones sean demasiado grandes */

      }
    
      /* Estilo responsivo para pantallas pequeñas */
      @media (max-width: 768px) {
        .button-container {
          top: 50%; /* Mueve los botones más abajo */
          flex-direction: column; /* Alinea los botones uno debajo del otro */
          width: 80%; /* Asegura que el contenedor se ajuste al tamaño de la pantalla */
        }
    
        .button-container button {
          width: 100%; /* Botones ocupan todo el ancho disponible */
          min-width: auto; /* Elimina el tamaño mínimo para que los botones puedan ser más pequeños en pantallas pequeñas */

        }
      }
    </style>
    
      
</section>

     <div id="navbar"></div>
    <script>
  fetch("navbar.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("navbar").innerHTML = data;

      // Mover aquí el contenido de navbar.js
      const menuToggle = document.getElementById("menu-toggle");
      const menu = document.getElementById("menu");
      const menuClose = document.getElementById("menu-close");

      if (menuToggle && menu && menuClose) {
        menuToggle.addEventListener("click", function () {
          menu.classList.toggle("active");
        });

        menuClose.addEventListener("click", function () {
          menu.classList.remove("active");
        });
      }

      // Smooth scroll
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();

          document.querySelector(this.getAttribute('href')).scrollIntoView({
            behavior: 'smooth'
          });
        });
      });
    });
</script>
