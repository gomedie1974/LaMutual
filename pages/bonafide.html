<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonafide | Mutual La Nación</title>
    <!-- pone el logo en la pestana -->
    <link rel="shortcut icon" href="../image/Logo Asociacion Mutual.JPG">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0056b3;
            --success-color: #198754;
            --discount-bg: #ff6b6b;
            --card-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        body { font-family: 'Roboto', sans-serif; background-color: #f8f9fa; }

        /* Icono WhatsApp */
        .whatsapp-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-decoration: none;
        }

        /* Banner */
        .banner-bonafide img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 0 0 15px 15px;
        }

        /* Cards Estilizadas */
        .card {
            border: none;
            border-radius: 18px;
            transition: all 0.3s ease-in-out;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .card-img-top {
            padding: 20px;
            height: 180px;
            object-fit: contain;
            cursor: zoom-in;
            transition: transform 0.3s ease;
        }

        .badge-discount {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: var(--discount-bg);
            color: white;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 8px;
            z-index: 10;
        }

        /* Zoom Overlay */
        #imageOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            cursor: zoom-out;
        }

        #imageOverlay img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <a href="https://api.whatsapp.com/send?phone=5491139546021" target="_blank" class="whatsapp-icon">
        <i class="fab fa-whatsapp"></i>
    </a>

<div id="navbar" class="sticky-top"></div>

    <section class="banner-bonafide">
        <div class="container-fluid p-0">
            <img src="../image/bonafide/Banner-combo-web-1600x450px-scaled.jpg" alt="Bonafide Banner" class="img-fluid">
        </div>
    </section>

    <section id="productos" class="py-5">
        <div class="container">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="contenedor-productos">
                </div>
        </div>
    </section>

    <div class="modal fade" id="modalPrecio" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="m-nombre">Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="p-3 mb-3" style="background-color: #f0fff4; border-radius: 15px;">
                        <p class="text-success fw-bold mb-3"><i class="fas fa-star me-2"></i>VALOR SOCIO</p>
                        <div class="d-flex align-items-center mb-1">
                            <span class="text-decoration-line-through text-muted me-2" id="m-original" style="font-size: 1.2 rem;"></span>
                            <span class="badge bg-danger">30% OFF</span>
                        </div>
                        <p class="text-success fw-bold mb-2" id="m-socio"></p>
                        <p class="mb-0 fw-bold" id="m-cuotas"></p>
                    </div>
                    <div class="p-3" style="background-color: #f8f9fa; border-radius: 15px;">
                        <p class="text-primary fw-bold mb-2">VALOR NO SOCIO</p>
                        <p class="h5 mb-0" id="m-nosocio"></p>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal" style="border-radius: 10px;">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="imageOverlay" onclick="this.style.display='none'">
        <img id="zoomedImage" src="" alt="Zoom">
    </div>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

            {

            },
            {

            },
            {

            {

            {

            {

                precioSocio: "$ 1.540,00",

                noSocio: "$ 2.200,00"
            },
             
        ];

        // RENDERIZAR PRODUCTOS
        const contenedor = document.getElementById('contenedor-productos');
        
        productos.forEach((p, index) => {
            const card = `
                <div class="col">
                    <div class="card h-100 shadow-sm">
                        <span class="badge-discount">30% OFF</span>
                        <img class="card-img-top zoomable" src="${p.img}" alt="${p.nombre}">
                        <div class="card-body text-center d-flex flex-column">
                            <h5 class="fw-bold mb-1">${p.nombre}</h5>
                            <p class="text-muted small mb-3">${p.desc}</p>
                            <div class="mt-auto d-flex justify-content-between align-items-center">
                                <span class="text-success fw-bold">${p.presentacion}</span>
                                <button class="btn btn-outline-primary btn-sm rounded-pill px-3" 
                                        onclick="abrirModal(${index})">
                                    <i class="fas fa-info-circle me-1"></i> Ver precio
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            contenedor.innerHTML += card;
        });

        // FUNCIONES LOGICA
        function abrirModal(index) {
            const p = productos[index];
            document.getElementById('m-nombre').textContent = p.nombre + " " + p.desc;
            document.getElementById('m-original').textContent = p.precioOriginal;
            document.getElementById('m-socio').textContent = p.precioSocio;
            document.getElementById('m-cuotas').textContent = p.cuotas;
            document.getElementById('m-nosocio').textContent = p.noSocio;
            
            new bootstrap.Modal(document.getElementById('modalPrecio')).show();
        }

        // ZOOM
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('zoomable')) {
                document.getElementById('zoomedImage').src = e.target.src;
                document.getElementById('imageOverlay').style.display = 'flex';
            }
        });

        // Carga de Navbar/Footer (tu lógica actual)
        ['navbar', 'footer'].forEach(id => {
            fetch(`${id}.html`)
                .then(r => r.text())
                .then(data => document.getElementById(id).innerHTML = data);
        });
    </script>
</body>
</html>
