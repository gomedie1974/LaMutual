    <style>
        :root {
            --primary-dark: #001a33;
            --accent-gold: #c5a059;
            --soft-white: #f8f9fa;
            --text-muted: #6c757d;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fcfcfc;
            color: var(--primary-dark);
            overflow-x: hidden;
        }

        h1, h2, h3, .premium-font {
            font-family: 'Playfair Display', serif;
        }

        /* --- Navbar --- */
        .navbar-custom {
            background: rgba(0, 26, 51, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--accent-gold);
            padding: 12px 0;
            z-index: 1050;
        }

        .nav-link {
            color: #fff !important;
            font-weight: 500;
            margin: 0 10px;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--accent-gold) !important;
        }

        /* --- Hero Split Section --- */
        .hero-split {
            padding: 80px 0;
            background: linear-gradient(135deg, #001a33 0%, #002d59 100%);
            color: white;
            border-radius: 0 0 50px 50px;
            margin-bottom: 50px;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        /* --- Contenedor del Mini-Carrusel --- */
        .hero-carousel-container {
            border-radius: 30px;
            overflow: hidden; /* Importante para bordes redondeados */
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 2px solid rgba(197, 160, 89, 0.3);
            background: white; /* Fondo para cuando cargan las fotos */
        }

        /* Ajustes específicos para las imágenes DENTRO del carrusel del hero */
        #hero-mini-carousel .item img {
            width: 100%;
            height: 220px; /* Altura fija controlada para que se vea elegante */
            object-fit: cover; /* Asegura que la imagen llene el espacio sin deformarse */
            display: block;
        }

        /* Estilo para los puntitos del carrusel (dots) */
        #hero-mini-carousel .owl-dots {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
        }

        #hero-mini-carousel .owl-dot span {
            background: rgba(255, 255, 255, 0.5);
            width: 10px;
            height: 10px;
            margin: 5px 7px;
        }

        #hero-mini-carousel .owl-dot.active span {
            background: var(--accent-gold);
            transform: scale(1.2);
        }

        /* --- Featurette Cards --- */
        .premium-card {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
            transition: var(--transition);
            height: 100%;
        }

        .premium-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .card-icon {
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
        }

        .btn-premium {
            background: var(--primary-dark);
            color: white;
            border-radius: 50px;
            padding: 12px 30px;
            border: 1px solid var(--primary-dark);
            font-weight: 600;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
        }

        .btn-premium:hover {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: white;
        }

        /* --- Accordion --- */
        .accordion-item {
            border: none;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            border-radius: 15px !important;
            overflow: hidden;
        }

        .accordion-button {
            font-weight: 600;
            padding: 20px;
        }

        .accordion-button:not(.collapsed) {
            background: #f0f4f8;
            color: var(--accent-gold);
        }

        /* --- WhatsApp --- */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
            z-index: 2000;
        }
        .home-icon {
            font-size: 1.2rem; /* Un poco más grande que el texto */
            padding-right: 15px; /* Espacio con el siguiente ítem */
        }

@media (max-width: 991px) {
    .home-icon {
        padding: 10px 0;
        font-size: 1.5rem; /* Más fácil de tocar en el celular */

}
    /* --- Estilo Premium para Dropdowns --- */
.navbar-custom .dropdown-menu {
    background-color: rgba(0, 26, 51, 0.98); /* Azul oscuro igual al navbar */
    border: 1px solid var(--accent-gold);    /* Borde dorado */
    border-radius: 12px;
    margin-top: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
}

.navbar-custom .dropdown-item {
    color: #ffffff !important;
    font-size: 0.9rem;
    padding: 10px 20px;
    font-family: 'Poppins', sans-serif;
    transition: var(--transition);
}

.navbar-custom .dropdown-item:hover {
    background-color: var(--accent-gold);
    color: var(--primary-dark) !important;
    padding-left: 25px; /* Efecto sutil de desplazamiento */
}

/* --- Unificación de tamaño de letra en Navbar --- */
.nav-link {
    font-size: 0.88rem !important; /* Un poco más pequeño para que sea elegante */
    letter-spacing: 0.3px;
}

/* Ajuste para el icono de Home */
.home-icon {
    padding-right: 15px;
    color: var(--accent-gold) !important; /* Lo hacemos dorado por defecto */
}
