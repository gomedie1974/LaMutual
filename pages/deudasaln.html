<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan de Pagos Mutual - Gestión Profesional</title>
<link rel="shortcut icon" href="../image/Logo Asociacion Mutual.JPG">

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
:root { --primary: #003366; --secondary: #6c757d; --bg: #f8f9fa; --success: #28a745; --danger: #dc3545; }
body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: #333; padding: 10px; margin: 0; }
.container { max-width: 1100px; margin: 10px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
.header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 15px; }
.header-left, .header-right { flex: 1; display: flex; align-items: center; }
.header-logo { height: 55px; width: auto; object-fit: contain; }
h2 { color: var(--primary); margin: 0; text-align: center; flex: 2; font-size: 1.6rem; }
p.subtitle { text-align: center; color: var(--secondary); margin-top: -15px; margin-bottom: 25px; font-size: 0.9em; }

.btn-lock { background-color: #f1f3f5; border: 1px solid #ced4da; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 0.85em; }
.btn-lock.unlocked { background-color: #fff3cd; border-color: #ffeeba; color: #856404; box-shadow: 0 4px 12px rgba(255,193,7,0.2); }
.btn-reset { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8em; margin-left: 10px; }

.summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
.card { background: #eef2f7; padding: 15px; border-radius: 10px; border-left: 5px solid var(--primary); }
.card span { display: block; font-size: 0.8em; color: var(--secondary); }
.card strong { font-size: 1.3em; color: var(--primary); }
.card.deuda-viva { border-left-color: var(--danger); background: #fff5f5; }

.inputs-grid { display: flex; flex-wrap: nowrap; justify-content: flex-start; gap: 20px; background: #fff; padding: 15px 20px; border: 1px solid #eee; border-radius: 10px 10px 0 0; align-items: flex-end; }
.group { display: flex; flex-direction: column; flex: 1; max-width: 200px; }
label { font-weight: 600; margin-bottom: 5px; font-size: 0.75em; color: var(--primary); text-transform: uppercase; }
input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; width: 100%; box-sizing: border-box; }

.btn-add-adelanto { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85em; width: 100%; }
.btn-print { background: var(--success); color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85em; width: 100%; }
.btn-del { background: none; border: none; color: var(--danger); cursor: pointer; font-weight: bold; padding: 5px; font-size: 1.2em; }

.table-wrapper { overflow-x: auto; border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 0.9em; min-width: 850px; }
th { background: var(--primary); color: white; padding: 12px; text-align: left; }
td { padding: 10px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
tr.pagado { background-color: #e8f5e9 !important; color: #2e7d32; }
tr.adelanto-row { background-color: #f1f8ff; }
.input-concepto { border: none; background: transparent; font-weight: bold; color: inherit; width: 100%; outline: none; padding: 4px; border-radius: 4px; }
.input-monto-adelanto { border: 1px solid #ddd; padding: 5px; border-radius: 4px; width: 130px; font-weight: bold; text-align: right; background: white; }
.btn-pay { background: white; border: 1.5px solid var(--success); color: var(--success); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100px; }
.btn-pay.active { background: var(--success); color: white; }

@media (max-width: 850px) { .inputs-grid { flex-wrap: wrap; } .group { max-width: 48%; min-width: 140px; } }
@media print { .inputs-grid, .btn-lock, .btn-pay, .btn-reset, .btn-link-edit, .btn-del { display: none !important; } }
</style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <div class="header-left"><img src="../image/Logo Asociacion Mutual.JPG" alt="Logo" class="header-logo"></div>
        <h2>Plan de Pagos: La Nación</h2>
        <div class="header-right">
            <button id="lockBtn" class="btn-lock" onclick="toggleEdicion()">🔒 Solo Lectura</button>
            <button id="resetBtn" class="btn-reset" style="display:none" onclick="resetearTodo()">Reiniciar</button>
        </div>
    </div>
    <p class="subtitle">Mutual del Diario La Nación - Gestión de Deuda Consolidada</p>

    <div class="summary-cards">
        <div class="card"><span>Deuda Original</span><strong>$ 27.784.837,27</strong>
            <div style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ccc; font-size: 0.8em;">
                <div style="display: flex; justify-content: space-between;">
                    <span>Galeno:</span><span style="font-weight: bold;">$ 24.564.272,22</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span>Circulación:</span><span style="font-weight: bold;">$ 3.220.565,05</span>
                </div>
            </div>
        </div>
        <div class="card deuda-viva"><span>Pendiente Actual</span><strong id="saldoPendienteReal">$ 0,00</strong></div>
        <div class="card"><span>Total Cobrado</span><strong id="totalPagado">$ 0,00</strong></div>
    </div>

    <div class="inputs-grid">
        <div class="group"><label>Cuotas Mensuales</label><input type="number" id="cuotas" class="edit-field" oninput="actualizarCuotas()"></div>
        <div class="group" style="max-width: 180px;"><label>&nbsp;</label><button class="btn-add-adelanto edit-field" onclick="agregarNuevoAdelanto()">➕ Agregar Adelanto</button></div>
        <div class="group" style="max-width: 120px;"><label>&nbsp;</label><button class="btn-print" onclick="window.print()">🖨️ Imprimir</button></div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th width="40">Tipo</th>
                    <th>Concepto</th>
                    <th>Fecha</th>
                    <th>Comp.</th>
                    <th>Monto</th>
                    <th width="110">Estado</th>
                    <th width="30"></th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyC1nSg8R6qY_rt0y4A5Cjd6Ipl3kPAiqf8",
    authDomain: "mutual-pagos-2895f.firebaseapp.com",
    databaseURL: "https://mutual-pagos-2895f-default-rtdb.firebaseio.com/",
    projectId: "mutual-pagos-2895f",
    storageBucket: "mutual-pagos-2895f.firebasestorage.app",
    messagingSenderId: "1003553822362",
    appId: "1:1003553822362:web:d0f23c4678dbeb98643123"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const dbRef = db.ref("mutual/planUnico");

let modoEdicion = false;
let llaveTemporal = "";
const DEUDA_TOTAL = 27784837.27;
let datos = { cuotas: 12, adelantos: [], pagosCuotas: {}, fechasCuotas: {}, conceptosCuotas: {}, links: {} };

const fmt = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 2 });

dbRef.on('value', (snapshot) => {
    const val = snapshot.val();
    if (val) { 
        datos = {
            ...val,
            adelantos: val.adelantos || [],
            pagosCuotas: val.pagosCuotas || {},
            fechasCuotas: val.fechasCuotas || {},
            conceptosCuotas: val.conceptosCuotas || {},
            links: val.links || {}
        };
        dibujarUI(); 
    }
});

async function toggleEdicion() {
    if (!modoEdicion) {
        const { value: pass } = await Swal.fire({ title: 'Acceso Restringido', input: 'password', inputLabel: 'Clave Maestra', confirmButtonColor: '#003366', showCancelButton: true });
        if (pass) {
            try { await db.ref("mutual/planUnico/admin_key").set(pass); llaveTemporal = pass; modoEdicion = true; dibujarUI(); }
            catch(e){ Swal.fire({ icon: 'error', title: 'Clave Incorrecta' }); }
        }
    } else { modoEdicion = false; llaveTemporal = ""; dibujarUI(); }
}

function dibujarUI() {
    const lockBtn = document.getElementById('lockBtn');
    lockBtn.innerHTML = modoEdicion ? "🔓 Modo Edición Activo" : "🔒 Solo Lectura";
    lockBtn.classList.toggle('unlocked', modoEdicion);
    document.getElementById('resetBtn').style.display = modoEdicion ? "block" : "none";
    document.getElementById('cuotas').value = datos.cuotas || 12;
    document.querySelectorAll('.edit-field').forEach(el => el.disabled = !modoEdicion);

    const cuerpo = document.getElementById('cuerpoTabla');
    cuerpo.innerHTML = "";
    let totalCobrado = 0;
    let sumaAdelantos = 0;

    // --- ORDENAMIENTO POR FECHA ---
    const adelantosOrdenados = datos.adelantos.map((ad, i) => ({...ad, idxOriginal: i}));
    adelantosOrdenados.sort((a, b) => {
        if (!a.fecha) return 1;
        if (!b.fecha) return -1;
        return new Date(a.fecha) - new Date(b.fecha);
    });

    // --- RENDERIZAR ADELANTOS ---
    adelantosOrdenados.forEach((ad) => {
        sumaAdelantos += ad.monto || 0;
        if(ad.pagado) totalCobrado += ad.monto || 0;
        
        const ds = !modoEdicion ? 'disabled' : '';
        const link = datos.links[`ad_${ad.idxOriginal}`] || "";

        cuerpo.innerHTML += `
            <tr class="adelanto-row ${ad.pagado ? 'pagado' : ''}">
                <td><b style="color:var(--primary)">A</b></td>
                <td><input type="text" value="${ad.concepto || 'Adelanto'}" onchange="updateAdelanto(${ad.idxOriginal}, 'concepto', this.value)" ${ds} class="input-concepto"></td>
                <td><input type="date" value="${ad.fecha || ''}" onchange="updateAdelanto(${ad.idxOriginal}, 'fecha', this.value)" ${ds} style="border:none; background:transparent; width:120px"></td>
                <td>
                    <button onclick="setLink('ad_${ad.idxOriginal}')" ${ds} class="btn-link-edit" style="cursor:pointer; border:1px solid #ccc; background:#fff; border-radius:4px;">🔗</button>
                    ${link ? `<a href="${link}" target="_blank" style="margin-left:5px; font-size:0.8em">Ver</a>` : ''}
                </td>
                <td><input type="text" value="${fmt.format(ad.monto || 0)}" onblur="manejarMontoAdelanto(${ad.idxOriginal}, this.value)" ${ds} class="input-monto-adelanto"></td>
                <td><button class="btn-pay ${ad.pagado ? 'active' : ''}" onclick="togglePagoAdelanto(${ad.idxOriginal})" ${ds}>${ad.pagado ? 'Pagado!' : 'Impago'}</button></td>
                <td><button class="btn-del" onclick="eliminarAdelanto(${ad.idxOriginal})" ${ds}>&times;</button></td>
            </tr>`;
    });

    // --- RENDERIZAR CUOTAS ---
    let remanente = Math.max(0, DEUDA_TOTAL - sumaAdelantos);
    let mCuota = remanente / (datos.cuotas || 1);

    for (let i = 1; i <= (datos.cuotas || 1); i++) {
        const pagada = datos.pagosCuotas[i];
        if(pagada) totalCobrado += mCuota;
        const link = datos.links[`c_${i}`] || "";
        const ds = !modoEdicion ? 'disabled' : '';

        cuerpo.innerHTML += `
            <tr class="${pagada ? 'pagado' : ''}">
                <td>${i}</td>
                <td><input type="text" value="${datos.conceptosCuotas[i] || 'Cuota Mensual '+i}" onchange="updateConceptoCuota(${i}, this.value)" ${ds} class="input-concepto"></td>
                <td><input type="date" value="${datos.fechasCuotas[i] || ''}" onchange="updateFechaCuota(${i}, this.value)" ${ds} style="border:none; background:transparent; width:120px"></td>
                <td>
                    <button onclick="setLink('c_${i}')" ${ds} class="btn-link-edit" style="cursor:pointer; border:1px solid #ccc; background:#fff; border-radius:4px;">🔗</button>
                    ${link ? `<a href="${link}" target="_blank" style="margin-left:5px; font-size:0.8em">Ver</a>` : ''}
                </td>
                <td style="font-weight:bold">${fmt.format(mCuota)}</td>
                <td><button class="btn-pay ${pagada ? 'active' : ''}" onclick="togglePagoCuota(${i})" ${ds}>${pagada ? 'Pagado!' : 'Impago'}</button></td>
                <td></td>
            </tr>`;
    }

    document.getElementById('totalPagado').innerText = fmt.format(totalCobrado);
    document.getElementById('saldoPendienteReal').innerText = fmt.format(DEUDA_TOTAL - totalCobrado);
}

// --- LOGICA DE MONEDA ---
function manejarMontoAdelanto(idx, valor) {
    if(!modoEdicion) return;
    let limpio = valor.replace(/[^\d,]/g, "").replace(",", ".");
    let num = parseFloat(limpio) || 0;
    datos.adelantos[idx].monto = num;
    guardar();
}

// --- FUNCIONES CORE ---
function agregarNuevoAdelanto() {
    if(!modoEdicion) return;
    datos.adelantos.push({ concepto: 'Nuevo Adelanto', fecha: '', monto: 0, pagado: false });
    guardar();
}

function updateAdelanto(idx, campo, valor) { if(modoEdicion) { datos.adelantos[idx][campo] = valor; guardar(); } }
function togglePagoAdelanto(idx) { if(modoEdicion) { datos.adelantos[idx].pagado = !datos.adelantos[idx].pagado; guardar(); } }
function eliminarAdelanto(idx) { if(modoEdicion) { datos.adelantos.splice(idx, 1); guardar(); } }

function updateConceptoCuota(i, v) { if(modoEdicion) { datos.conceptosCuotas[i] = v; guardar(); } }
function updateFechaCuota(i, v) { if(modoEdicion) { datos.fechasCuotas[i] = v; guardar(); } }
function togglePagoCuota(i) { if(modoEdicion) { datos.pagosCuotas[i] = !datos.pagosCuotas[i]; guardar(); } }
function actualizarCuotas() { if(modoEdicion) { datos.cuotas = parseInt(document.getElementById('cuotas').value) || 1; guardar(); } }

async function setLink(id) { 
    if(!modoEdicion) return; 
    const { value: url } = await Swal.fire({ title: 'URL Comprobante', input: 'url', inputValue: datos.links[id] || "", showCancelButton: true }); 
    if (url !== undefined) { datos.links[id] = url; guardar(); } 
}

function guardar() {
    if(!modoEdicion) return;
    const copia = JSON.parse(JSON.stringify(datos));
    copia.admin_key = llaveTemporal;
    dbRef.set(copia);
}

async function resetearTodo() { 
    if(!modoEdicion) return; 
    const res = await Swal.fire({ title: '¿Reiniciar sistema?', text: "Esto borrará los adelantos actuales para limpiar la base de datos.", icon: 'warning', showCancelButton: true }); 
    if (res.isConfirmed) { dbRef.set({ cuotas: 12, adelantos: [], admin_key: llaveTemporal }); } 
}
</script>
</body>
</html>
