 <style>
body {
  background-color: #000;
  background-image: url('../image/lollaimagen.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: white;
  font-family: 'Verdana', Geneva, Tahoma, sans-serif;
}

/* Solo el contenido principal tiene la animación */
.page-content {
  opacity: 0;
  transform: scale(1.05);
  animation: fadeInBackground 1.5s ease-out forwards;
}

@keyframes fadeInBackground {
  0% {
    opacity: 0;
    transform: scale(1.05);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

.highlight-text {
  font-size: clamp(1.5rem, 2.8vw + 1rem, 3rem);
  font-weight: 800;
  text-align: center;
  color: #d63384;
  margin: 0 auto 30px auto;
  font-family: 'Verdana', Geneva, Tahoma, sans-serif;
  letter-spacing: 1px;
  white-space: normal;
  max-width: 90%;
  line-height: 1.3;
  display: inline-block; /* ✅ importante para centrar y mantener bloques */
  word-break: keep-all;  /* ✅ evita cortes en palabras */
}

.highlight-text span {
  display: inline-block;
  transition: color 0.3s ease, transform 0.3s ease;
}

.highlight-text span.active {
  transform: scale(1.2);
}

/* Ajuste para celulares */
@media (max-width: 768px) {
  .highlight-text {
    font-size: 1.4rem;
    letter-spacing: 0.5px;
    line-height: 1.4;
    max-width: 95%;
  }
}
/* Botón fijo arriba a la derecha */
#btnReservaFijo {
  position: fixed;
  top: 70px;
  right: 20px;
  z-index: 9999;
  border-radius: 6px;    /* menos redondeado */
  padding: 6px 12px;     /* menos alto y ancho */
  font-size: 1.25rem;    /* texto un poco más chico */
}
/* 📱 Versión más chica para celulares */
@media (max-width: 576px) {
  #btnReservaFijo {
    top: 60px;
    right: 15px;
    padding: 6px 12px;
    font-size: 1.1rem;
    border-radius: 6px;
  }
}


</style> 

<body>
  <div id="navbar" class="sticky-top"></div>

 <!-- Botón de reserva arriba a la derecha -->
<div class="d-flex justify-content-end my-1">
<a href="./proximamente.html" id="btnReservaFijo" class="btn btn-warning">
  <b>Reservar entradas</b>
</a> <br><br>
</div> 


 <!-- Contenedor animado -->
  <div class="page-content">
    <div class="container px-4 px-lg-5">
      <div class="row gx-4 gx-lg-5 justify-content-center ">
        <h1 class="highlight-text text-center" id="animatedText">
          El festival más esperado por los amantes de la música en vivo.
        </h1>

        <div class="col-lg-8 mx-auto text-center">
          <img class="img-fluid rounded shadow-sm mb-4" 
               src="../image/lollapalooza.jpg" 
               alt="Lollapalooza" 
               style="max-width: 90%; border-radius: 20px;">
        </div>
        
        <hr style="color: white;"><br>

        <div class="text-center">
          <p style="color: white; font-size: xx-large; font-weight: 900;">13, 14 y 15 de marzo 2026 <br>Lineup</p>
          <img class="img-fluid rounded mb-4" 
               src="../image/lollapaloozalineup.avif" 
               style="max-width: 80%; border-radius: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.1);" />
        </div>
      </div>
    </div>
  </div>

  

  <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/182krEsBsawQ9FSdBLQoEC?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

<script>
const textElement = document.getElementById('animatedText');
const text = textElement.textContent.trim();
textElement.textContent = "";

// Creamos palabras en lugar de letras, y luego cada letra en span
text.split(" ").forEach((word, wordIndex) => {
  const wordSpan = document.createElement("span");
  wordSpan.style.display = "inline-block";
  wordSpan.style.marginRight = "6px"; // espaciado entre palabras

  word.split("").forEach((char, index) => {
    const span = document.createElement("span");
    span.textContent = char;
    span.style.color = "#d63384";
    wordSpan.appendChild(span);

    setTimeout(() => {
      span.style.color = "white";
      span.classList.add("active");
      setTimeout(() => span.classList.remove("active"), 200);
    }, 50 * (index + wordIndex * 5));
  });

  textElement.appendChild(wordSpan);
});
</script>


<div id="footer"></div>
<script>
  fetch("footer.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    });
</script>

    <!-- JAVA -->
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <script>
  fetch("navbar.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("navbar").innerHTML = data;

      // Mover aquí el contenido de navbar.js
      const menuToggle = document.getElementById("menu-toggle");
      const menu = document.getElementById("menu");
      const menuClose = document.getElementById("menu-close");

      if (menuToggle && menu && menuClose) {
        menuToggle.addEventListener("click", function () {
          menu.classList.toggle("active");
        });

        menuClose.addEventListener("click", function () {
          menu.classList.remove("active");
        });
      }

      // Smooth scroll
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();

          document.querySelector(this.getAttribute('href')).scrollIntoView({
            behavior: 'smooth'
          });
        });
      });
    });
</script>
     
</body>
</html>
