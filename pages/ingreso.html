    <div class="container my-5">

        <h2 class="text-center mb-4 text-primary" style="font-weight: bold;">
            <i class="bi bi-journal-text"></i> Solicitud de Ingreso </h2>

        <form id="solicitudForm" action="https://formspree.io/f/mkgrabze" method="POST">
            <!-- Datos personales -->
            <div class="form-section">
                <h5><b>Datos Personales</b></h5>
                <div class="row g-3">
                    <div class="col-md-6"><label>Nombre y Apellido</label><input name="Nombre y Apellido" type="text" class="form-control" required /></div>
                    <div class="col-md-3">
                    <label for="tipo_documento">Tipo de documento</label>
                    <select name="Tipo de documento" id="tipo_documento" class="form-select" required>
                        <option value="" disabled selected>Seleccione</option>
                        <option value="dni">DNI</option>
                        <option value="pasaporte">Pasaporte</option>
                        <option value="otro">Otro</option>
                    </select>
                    </div>

                    <div class="col-md-3">
                    <label for="numero_documento">Número de documento</label>
                    <input type="number"  name="Numero de documento" id="numero_documento" type="text" class="form-control" required min="0" step="1">
                    </div>
                    <div class="row g-3">
                    <div class="col-md-3">
                        <label for="Cuil">CUIL</label>
                        <input name="cuil" id="cuil" type="text" class="form-control" placeholder="XX-XXXXXXXX-X" required>
                    </div>
                    <div class="col-md-3">
                        <label>Fecha de Nacimiento</label>
                        <input name="Fecha de nacimiento" type="date" class="form-control" required/>
                    </div>
                    <div class="col-md-3">
                        <label>Nacionalidad</label>
                        <input name="Nacionalidad" type="text" class="form-control" />
                    </div>
                    <div class="col-md-3">
                        <label>Estado Civil</label>
                        <input name="Estado civil" type="text" class="form-control" />
                    </div>
                    </div>

                    <div class="col-md-8"><label>Mail</label><input type="email" name="Mail" type="email" class="form-control" required /></div>
                    <div class="col-md-4"><label>Celular</label><input type="number" name="Celular" type="text" class="form-control" required min="0" step="1"/></div>

                    <div class="col-12"><label>Domicilio</label><input name="Domicilio" type="text" class="form-control" required/></div>
                    
                    <div class="col-md-5"><label>Localidad</label><input name="Localidad" type="text" class="form-control" required/></div>
                    <div class="col-md-5"><label>Provincia</label><input name="Provincia" type="text" class="form-control" required/></div>
                    <div class="col-md-2"><label>CP</label><input name="CP" type="text" class="form-control" required/></div>
                </div>
            </div>

            <!-- Empresa -->
            <div class="form-section">
                <h5><b>Empresa</b></h5>
                <div class="row g-3">
                    <div class="col-md-6"><label>Empresa</label><input name="Empresa" type="text" class="form-control" required/></div>
                    <div class="col-md-6"><label>Sección</label><input name="Seccion" type="text" class="form-control" /></div>

        <!-- Hijos -->
        <div class="form-section">
            <h5><b>Hijos</b></h5>

                <!-- Tabla visible solo en pantallas medianas y grandes -->
                <div class="table-responsive d-none d-md-block" style="overflow: unset;">
                <table class="table table-bordered align-middle" id="tabla-hijos">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 23%;">Apellido</th>
                        <th style="width: 23%;">Nombre</th>
                        <th style="width: 23%;">Fecha Nac.</th>
                        <th style="width: 20%;">Nro doc</th>
                        <th style="width: 11%;"></th>
                    </tr>
                    </thead>
                    <tbody id="hijos-body">
                    </tbody>
                </table>
                </div>

                <!-- Vista móvil: tarjetas para hijos -->
                <div id="hijos-mobile" class="d-block d-md-none">
                <!-- Las tarjetas de hijos se agregan dinámicamente acá -->
                </div>

                <button type="button" class="btn btn-success btn-sm" onclick="agregarHijo()" title="Agregar hijo">
                <i class="bi bi-plus-lg"></i> Agregar hijo
                </button>


                <!-- Botón de envío -->
                <div class="text-center mt-4 w-100">
                <button type="submit" class="btn btn-primary px-5">Enviar Solicitud</button>
                </div>

                <script>
                function agregarHijo() {
                // ---- Versión de escritorio ----
                const tbody = document.getElementById("hijos-body");
                const nuevaFila = document.createElement("tr");
                nuevaFila.innerHTML = `
                    <td><input name="Hijo apellido" type="text" class="form-control" required /></td>
                    <td><input name="Hijo nombre" type="text" class="form-control" required /></td>
                    <td><input name="Hijo fecha" type="date" class="form-control" required /></td>
                    <td><input name="Hijo doc" type="number" class="form-control" required /></td>
                    <td class="text-center">
                    <button type="button" class="btn btn-outline-danger btn-sm rounded-circle" onclick="eliminarFila(this)" title="Eliminar hijo">
                        <i class="bi bi-trash"></i>
                    </button>
                    </td>`;
                tbody.appendChild(nuevaFila);

                // ---- Versión móvil ----
                const contenedorMobile = document.getElementById("hijos-mobile");
                const card = document.createElement("div");
                card.className = "card mb-2 p-3";
                card.innerHTML = `
                    <div class="mb-2">
                    <label>Apellido</label>
                    <input name="Hijo apellido" type="text" class="form-control" required />
                    </div>
                    <div class="mb-2">
                    <label>Nombre</label>
                    <input name="Hijo nombre" type="text" class="form-control" required />
                    </div>
                    <div class="mb-2">
                    <label>Fecha Nac.</label>
                    <input name="Hijo fecha" type="date" class="form-control" required />
                    </div>
                    <div class="mb-2">
                    <label>Nro doc</label>
                    <input name="Hijo doc" type="number" class="form-control" required />
                    </div>
                    <div class="text-end">
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="eliminarCard(this)" title="Eliminar hijo">
                        <i class="bi bi-trash"></i>
                    </button>
                    </div>
                `;
                contenedorMobile.appendChild(card);
                }

                function eliminarFila(boton) {
                const fila = boton.closest("tr");
                fila.remove();
                }

                function eliminarCard(boton) {
                const card = boton.closest(".card");
                card.remove();
                }
                </script>


            </div>
            </div>

            

        
        </form>

    <!-- SweetAlert2 -->
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="../achavalferrer.js"></script>

    <div id="navbar"></div>
    <script>
        fetch("navbar.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("navbar").innerHTML = data;

                const menuToggle = document.getElementById("menu-toggle");
                const menu = document.getElementById("menu");
                const menuClose = document.getElementById("menu-close");

                if (menuToggle && menu && menuClose) {
                    menuToggle.addEventListener("click", function () {
                        menu.classList.toggle("active");
                    });

                    menuClose.addEventListener("click", function () {
                        menu.classList.remove("active");
                    });
                }

                document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                    anchor.addEventListener('click', function (e) {
                        e.preventDefault();

                        document.querySelector(this.getAttribute('href')).scrollIntoView({
                            behavior: 'smooth'
                        });
                    });
                });
            });
    </script>

    <!-- Envío con fetch + mensaje + redirección -->
    <script>
        const form = document.getElementById('solicitudForm');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = new FormData(form);

            fetch(form.action, {
                method: form.method,
                headers: {
                    'Accept': 'application/json'
                },
                body: formData
            })
                .then(response => {
                    if (response.ok) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Formulario enviado correctamente',
                            showConfirmButton: false,
                            timer: 2000
                        });
                        setTimeout(() => {
                            window.location.href = '../index.html'; // Cambia aquí si tu página de inicio tiene otra URL
                        }, 2000);
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error al enviar el formulario',
                            text: 'Por favor, intente nuevamente.'
                        });
                    }
                })
                .catch(error => {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error de red',
                        text: 'Por favor, revise su conexión y vuelva a intentarlo.'
                    });
                });
        });
    </script>
    <script src="https://unpkg.com/imask"></script>
    <script>
    const cuilInput = document.getElementById('cuil');
    if (cuilInput) {
        IMask(cuilInput, {
        mask: '00-00000000-0',
        lazy: false, // Esto hace que los guiones aparezcan siempre
        placeholderChar: '_' // Muestra guiones fijos y guiones bajos como guía
        });
    }
    </script>
