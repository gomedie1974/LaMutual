<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indumentaria | Mutual La Nación</title>
    <meta name="description" content="Mutual del personal de La Nación, productos y servicios con beneficios exclusivos para todos sus empleados">
    <!-- Whatsapp -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">      
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <!-- pone el logo en la pestana -->
    <link rel="shortcut icon" href="../image/Logo Asociacion Mutual.JPG">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    
    <style>
        :root {
            --primary: #2b319f;
            --primary-dark: #161a5e;
            --accent: #ff6b6b;
            --socio: #129c00;
            --bg-light: #f0f2f5;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: #333;
            margin: 0;
        }

        /* --- HEADER: BLANCO CON LETRAS NEGRAS --- */
        .page-header {
            padding: 10px 0 30px 0;
            background-color: #ffffff; /* Fondo blanco */
            color: #000000; /* Letras negras */
            text-align: center;
            margin-bottom: 60px;
            border-bottom: 1px solid #ddd;
        }

        .header-title { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; letter-spacing: -1.5px; }
        
        .header-description {
            font-size: 1.2rem;
            opacity: 0.8;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        /* --- BUSCADOR --- */
        .search-container {
            max-width: 650px;
            margin: 0 auto;
            display: flex;
            background: white;
            padding: 10px;
            border-radius: 60px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); /* Tu sombra original */
            position: relative;
            z-index: 10;
        }

        .search-wrapper { position: relative; flex-grow: 1; }

        .search-input {
            width: 100%;
            border: none;
            padding: 15px 20px 15px 55px;
            border-radius: 50px;
            font-size: 1.1rem;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 1.2rem;
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 35px;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.3s;
        }

        /* --- CARDS ORIGINALES --- */
        .product-card {
            background: white;
            border: none;
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
        }

        .product-card:hover { transform: translateY(-10px); }

        .img-container {
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            cursor: zoom-in;
        }

        .img-container img { max-height: 100%; max-width: 100%; object-fit: contain; }

        .product-info { padding: 20px; text-align: center; flex-grow: 1; }
        
        .price-box {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            margin-top: 10px;
        }

        .price-socio { color: var(--socio); font-weight: 800; font-size: 1xrem; display: block; }
        .price-nosocio { color: var(--primary); font-weight: 700; font-size: 0.9rem; display: block; opacity: 0.8; }
        
        /* --- ZOOM OVERLAY --- */
        .image-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 10000; cursor: zoom-out;
        }
        .image-overlay img { max-width: 90%; max-height: 90%; border-radius: 10px; }

        .whatsapp-icon {
            position: fixed; bottom: 30px; right: 30px;
            background: #25d366; color: white;
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 999; text-decoration: none;
        }
        .btn-whatsapp-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-top: 15px;
            transition: background 0.3s ease;
        }

        .btn-whatsapp-card:hover {
            background-color: #128c7e;
            color: white;
        }

        /* Ajuste para que el info-box no empuje el botón fuera de la card */
        .product-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div id="navbar" class="sticky-top"></div>

    <header class="page-header">
        <div class="container">
            <h1 class="header-title">Indumentaria</h1>
            <p class="header-description">Prendas seleccionadas con beneficios exclusivos para nuestros asociados.</p>

            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="buscador" class="search-input" placeholder="Buscá por nombre, color o talle...">
                </div>
                <button class="search-btn">BUSCAR</button>
            </div>
        </div>
    </header>

    <div class="container mb-5">
        <div class="row g-4" id="contenedor-productos"></div>
    </div>

    <div class="image-overlay" id="imageOverlay">
        <img id="zoomedImage" src="" alt="Zoom">
    </div>

    <a href="https://api.whatsapp.com/send?phone=5491139546021" target="_blank" class="whatsapp-icon">
        <i class="fab fa-whatsapp"></i>
    </a>

    <div id="footer"></div>

    <script>
        const productos = [ 
            { nombre: "Ruana paño", talle: "U", color: "Chocolate", imagen: "../image/tienda/20260517_134327.jpg", precioSocio: "41.500,00", cuotas: "$ 10.375,00", precioNoSocio: "55.900,00", descuento: "" },      
            { nombre: "Campera Morley Brush", talle: "U", color: "Bordó jaspeado", imagen: "../image/tienda/20260517_132140.jpg", precioSocio: "27.900,00", cuotas: "$ 6.975,00", precioNoSocio: "35.900,00", descuento: "" },      
            { nombre: "Campera tejida", talle: "S/M", color: "Of White", imagen: "../image/tienda/20260517_132326.jpg", precioSocio: "48.000,00", cuotas: "$ 12.000,00", precioNoSocio: "61.900,00", descuento: "" },      
            { nombre: "Sweater media polera", talle: "U", color: "blanco/negro", imagen: "../image/tienda/20260517_132615.jpg", precioSocio: "38.900,00", cuotas: "$ 9.725,00", precioNoSocio: "45.900,00", descuento: "" },      
            { nombre: "Sweater polera", talle: "U", color: "Beige", imagen: "../image/tienda/20260517_132850.jpg", precioSocio: "28.900,00", cuotas: "$ 7.225,00", precioNoSocio: "35.900,00", descuento: "" },      
            { nombre: "Cárdigan rombos", talle: "U", color: "Gris", imagen: "../image/tienda/20260517_133042.jpg", precioSocio: "49.900,00", cuotas: "$ 12.475,00", precioNoSocio: "65.900,00", descuento: "" },      
            { nombre: "Sweater Bremer", talle: "U", color: "Bordó", imagen: "../image/tienda/20260517_133330.jpg", precioSocio: "38.900,00", cuotas: "$ 9.725,00", precioNoSocio: "45.900,00", descuento: "" },      
            { nombre: "Chaleco punto inglés", talle: "U", color: "Chocolate", imagen: "../image/tienda/20260517_133523.jpg", precioSocio: "46.500,00", cuotas: "$ 11.625,00", precioNoSocio: "57.900,00", descuento: "" },      
            { nombre: "Remera Morley", talle: "XL", color: "Blanco", imagen: "../image/tienda/20260517_133811.jpg", precioSocio: "12.900,00", cuotas: "$ 3.225,00", precioNoSocio: "20.900,00", descuento: "" },      
            { nombre: "Sweater Escote V", talle: "U", color: "Ladrillo", imagen: "../image/tienda/20260517_134103.jpg", precioSocio: "38.900,00", cuotas: "$ 9.725,00", precioNoSocio: "45.900,00", descuento: "" },      


            { nombre: "Remera Morley", talle: "U", color: "Chocolate", imagen: "../image/tienda/20260509_134445.jpg", precioSocio: "27.600,00", cuotas: "$ 6.900,00", precioNoSocio: "35.900,00", descuento: "" },      
            { nombre: "Remera Morley ancho", talle: "U", color: "Bordó", imagen: "../image/tienda/20260509_134636.jpg", precioSocio: "29.900,00", cuotas: "$ 7.475,00", precioNoSocio: "37.900,00", descuento: "" },      
            { nombre: "Sweater Bariloche", talle: "U", color: "Pistacho", imagen: "../image/tienda/20260509_134810.jpg", precioSocio: "37.500,00", cuotas: "$ 9.375,00", precioNoSocio: "55.900,00", descuento: "" },      
            { nombre: "Cardigan Bordado", talle: "U", color: "Verde", imagen: "../image/tienda/20260509_135041.jpg", precioSocio: "39.900,00", cuotas: "$ 9.975,00", precioNoSocio: "65.900,00", descuento: "" },      
            { nombre: "Sweater cuello polo", talle: "U", color: "Gris/Beige", imagen: "../image/tienda/20260509_135314.jpg", precioSocio: "38.500,00", cuotas: "$ 9.625,00", precioNoSocio: "55.900,00", descuento: "" },     

            

 
           /* RUMRUM */
            { nombre: "RUM RUM - Pantalón Silvito Gabardina", talle: "2", color: "Azulino", imagen: "../image/rumrum/pantalonsilvitocorderoyazulmarino.png", precioSocio: "14.988,00", cuotas: "$ 3.747,00", precioNoSocio: "24.980,00", descuento: "40% OFF" },
            { nombre: "RUM RUM - Pantalón Silvito Corderoy", talle: "4", color: "Bordó", imagen: "../image/rumrum/pantalonsilvitocorderoybordo.png", precioSocio: "11.567,53", cuotas: "$ 2.891,88", precioNoSocio: "19.279,00", descuento: "40% OFF" },
            { nombre: "RUM RUM - Pantalón Silvito Corderoy", talle: "4 y 6", color: "Negro", imagen: "../image/rumrum/pantalonsilvitogabardinaazulmarino.png", precioSocio: "11.567,53", cuotas: "$ 2.891,88", precioNoSocio: "19.279,00", descuento: "40% OFF" },
            { nombre: "RUM RUM - Pantalón Gabardina Leclerc", talle: "2", color: "Azulino", imagen: "../image/rumrum/pantalongabardinaleclercazulmarino.png", precioSocio: "15.588,00", cuotas: "$ 3.897,00", precioNoSocio: "25.980,00", descuento: "40% OFF" }
        ];

        function render(lista) {
            const container = document.getElementById('contenedor-productos');
            container.innerHTML = '';
            lista.forEach(p => {
                container.innerHTML += `
                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="product-card">
                            ${p.descuento ? `<span style="position:absolute;top:15px;left:15px;background:var(--accent);color:white;padding:5px 12px;font-size:0.8rem;font-weight:800;border-radius:50px;z-index:2">${p.descuento}</span>` : ''}
                            <div class="img-container" onclick="abrirZoom('${p.imagen}')">
                                <img src="${p.imagen}" alt="${p.nombre}">
                            </div>
                            <div class="product-info">
                                <h5>${p.nombre}</h5>
                                <small>Talle: ${p.talle} | Color: ${p.color}</small>
                                <div class="price-box">
                                    <span style="font-size:0.7rem; font-weight:800; color:var(--socio)">SOCIO</span>
                                    <span class="price-socio">$ ${p.precioSocio}</span>
                                    <small class="text-muted">4 cuotas de <br> ${p.cuotas}</small>
                                    <hr>
                                    <span style="font-size:0.7rem; font-weight:800; color:var(--primary)">NO SOCIO</span>
                                    <span class="price-nosocio">$ ${p.precioNoSocio}</span>
                                    
                                     <a href="https://api.whatsapp.com/send?phone=5491139546021&text=Hola!%20Me%20interesa%20el%20producto:%20${encodeURIComponent(p.nombre)}%20en%20color%20${p.color}" target="_blank" class="btn-whatsapp-card"> <i class="fab fa-whatsapp"></i> Consultar </a>   

                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function abrirZoom(src) {
            document.getElementById('zoomedImage').src = src;
            document.getElementById('imageOverlay').style.display = 'flex';
        }

        document.getElementById('imageOverlay').onclick = function() { this.style.display = 'none'; }

        // BUSCADOR CORREGIDO
        document.getElementById('buscador').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtrados = productos.filter(p => 
                p.nombre.toLowerCase().includes(term) || 
                p.color.toLowerCase().includes(term) ||
                p.talle.toLowerCase().includes(term)
            );
            render(filtrados);
        });

        window.onload = () => {
            render(productos); // Esto asegura que carguen al inicio
            fetch("navbar.html").then(r => r.text()).then(d => document.getElementById("navbar").innerHTML = d);
            fetch("footer.html").then(r => r.text()).then(d => document.getElementById("footer").innerHTML = d);
        };
    </script>
</body>
</html>
