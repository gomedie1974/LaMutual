    <style>
        :root {
            --primary: #2b319f;
            --primary-dark: #161a5e;
            --accent: #ff6b6b;
            --socio: #129c00;
            --bg-light: #f0f2f5;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: #333;
            margin: 0;
        }

        /* --- HEADER --- */
        .page-header {
            padding: 20px 0 40px 0;
            color: #000;
            border-radius: 0 0 50px 50px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 60px;
            background: white;
            position: relative;
        }

        .header-title {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1.5px;
        }

        .header-description {
            font-size: 1.1rem;
            opacity: 0.8;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        /* --- BUSCADOR CON BOTÓN LIMPIAR --- */
        .search-container {
            max-width: 650px;
            margin: 0 auto;
            display: flex;
            background: white;
            padding: 10px;
            border-radius: 60px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            position: relative;
            z-index: 10;
            border: 1px solid #eee;
            align-items: center;
        }

        .search-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            border: none;
            padding: 15px 15px 15px 55px;
            border-radius: 50px;
            font-size: 1.1rem;
            outline: none;
            color: #333;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            color: var(--primary);
            font-size: 1.2rem;
        }

        /* Botón de Limpiar Texto */
        .btn-limpiar-texto {
            background: #f0f0f0;
            color: #666;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 10px;
            cursor: pointer;
            display: none; /* Se activa por JS */
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-limpiar-texto:hover {
            background: #e0e0e0;
            color: var(--accent);
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: var(--accent);
            transform: scale(1.02);
        }

        /* --- CARDS DE PRODUCTOS --- */
        .product-card {
            background: white;
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }

        .img-container {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #fff;
        }

        .img-container img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .badge-discount {
            position: absolute;
            top: 15px; left: 15px;
            background: var(--accent);
            color: white;
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: 800;
            border-radius: 50px;
            z-index: 2;
        }

        .product-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-info h5 {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 15px;
            min-height: 45px;
            line-height: 1.4;
            color: #1a1a1a;
        }

        .price-section {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            margin-top: auto;
        }

        .label-socio { display: block; color: var(--socio); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .price-old { font-size: 0.85rem; color: #bbb; text-decoration: line-through; }
        .price-socio { font-size: 1.15rem; font-weight: 800; color: var(--socio); display: block; }
        .cuotas { font-size: 0.8rem; color: #777; display: block; margin-bottom: 8px; }
        .no-socio-box { border-top: 1px dashed #ddd; padding-top: 8px; margin-top: 5px; }
        .price-nosocio { font-size: 0.9rem; font-weight: 700; color: var(--primary); display: block; }

        .whatsapp-icon {
            position: fixed; bottom: 30px; right: 30px;
            background: #25d366; color: white;
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 9999; text-decoration: none;
            transition: transform 0.3s;
        }
        .whatsapp-icon:hover { transform: scale(1.1); color: white; }

        #no-results { text-align: center; padding: 100px 0; display: none; }

        @media (max-width: 768px) {
            .header-title { font-size: 2.2rem; }
            .search-btn { display: none; }
            .search-container { margin: 0 15px; }
        }
        .btn-whatsapp-card {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background-color: #25d366;
        color: white;
        text-decoration: none;
        padding: 10px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.9rem;
        margin-top: 15px;
        transition: background 0.3s ease;
    }

    .btn-whatsapp-card:hover {
        background-color: #128c7e;
        color: white;
    }

    /* Ajuste para que el info-box no empuje el botón fuera de la card */
    .product-info {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
  </style>
</head>

        // 2. RENDERIZADO
function render(lista) {
    const contenedor = document.getElementById('contenedor-productos');
    const noRes = document.getElementById('no-results');
    
    if (!contenedor) return; // Seguridad por si el DOM no cargó
    contenedor.innerHTML = '';
    
    if (lista.length === 0) {
        if (noRes) noRes.style.display = 'block';
    } else {
        if (noRes) noRes.style.display = 'none';
        
        lista.forEach(p => {
            // 1. Limpiamos los <br> del nombre para que no den error en WhatsApp
            const nombreParaWhatsApp = p.nombre.replace(/<br\s*\/?>/gi, ' ');
            
            // 2. Preparamos la etiqueta de nuevo ingreso
            const etiquetaNuevo = p.nuevo ? `
                <br>
                <span style="background: #007bff; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: 800; display: inline-block; margin-top: 5px; line-height: 1;">
                    NUEVO INGRESO
                </span>` : '';

            // 3. Generamos el HTML
            contenedor.innerHTML += `
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="product-card">
                        <span class="badge-discount">${p.descuento}</span>
                        <div class="img-container">
                            <img src="${p.imagen}" alt="${nombreParaWhatsApp}" onclick="abrirZoom('${p.imagen}')">
                        </div>
                        <div class="product-info">
                            <h5>${p.nombre}${etiquetaNuevo}</h5>
                            <div class="price-section">
                                <span style="color: #129c00; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; display: block;">Socio</span>
                                
                                <span style="text-decoration: line-through; color: #999; font-size: 0.85rem; display: block; margin-bottom: -5px;">
                                    $ ${p.precioViejo}
                                </span>
                                
                                <span class="price-socio" style="color: #129c00; font-weight: 800; font-size: 1rem; display: block;">
                                    $ ${p.precioSocio}
                                </span>
                                
                                <small style="color: #666; font-size: 0.75rem; display: block; margin-bottom: 8px;">${p.cuotas}</small>
                                
                                <div style="border-top: 1px dashed #ccc; margin-top: 8px; padding-top: 8px;">
                                    <span style="font-size: 0.85rem; color: #444; font-weight: 600;">
                                        <small>No Socio:</small> $ ${p.precioNoSocio}
                                    </span>
                                    <a href="https://api.whatsapp.com/send?phone=5491139546021&text=Hola!%20Me%20interesa%20el%20producto:%20${encodeURIComponent(nombreParaWhatsApp)}" 
                                       target="_blank" 
                                       class="btn-whatsapp-card"> 
                                        <i class="fab fa-whatsapp"></i> Consultar 
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }
}

// 3. EVENTOS (Búsqueda y Limpiar)
        buscador.addEventListener('input', (e) => {
            const valor = e.target.value.toLowerCase();
            
            // Mostrar botón limpiar si hay texto
            btnLimpiar.style.display = valor.length > 0 ? 'block' : 'none';

            const filtrados = productos.filter(p => 
                p.nombre.toLowerCase().includes(valor)
            );
            render(filtrados);
        });

        btnLimpiar.addEventListener('click', () => {
            buscador.value = '';
            btnLimpiar.style.display = 'none';
            render(productos);
            buscador.focus();
        });

        // 4. CARGA INICIAL
        window.onload = () => {
            render(productos);
            
        };
    </script>
    <div id="imageModal" style="display: none; position: fixed; z-index: 10000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; cursor: zoom-out;">
    <img id="imgZoom" style="max-width: 90%; max-height: 90%; border-radius: 10px; transition: transform 0.3s ease; cursor: default;">
</div>
<script>
const modal = document.getElementById("imageModal");
const imgZoom = document.getElementById("imgZoom");

// Al abrir, siempre empezamos sin zoom
function abrirZoom(src) {
    modal.style.display = "flex";
    imgZoom.src = src;
    imgZoom.style.transform = "scale(1)";
    imgZoom.style.cursor = "zoom-in"; 
    document.body.style.overflow = "hidden";
}

// Lógica de click en la imagen
imgZoom.onclick = function(e) {
    e.stopPropagation(); // Evita que el click pase al fondo
    
    if (this.style.transform === "scale(1.5)") {
        // Si ya tiene zoom, el siguiente click hace "zoom out" y CIERRA
        cerrarTodo();
    } else {
        // Si no tiene zoom, lo AGRANDA
        this.style.transform = "scale(1.5)";
        this.style.cursor = "zoom-out"; // Cambia la lupa a menos (-)
    }
};

// Si tocan el fondo negro, también cerramos
modal.onclick = cerrarTodo;

function cerrarTodo() {
    imgZoom.style.transform = "scale(1)";
    modal.style.display = "none";
    document.body.style.overflow = "auto";
}
</script>
 <script>
  fetch("navbar.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("navbar").innerHTML = data;

      // Mover aquí el contenido de navbar.js
      const menuToggle = document.getElementById("menu-toggle");
      const menu = document.getElementById("menu");
      const menuClose = document.getElementById("menu-close");

      if (menuToggle && menu && menuClose) {
        menuToggle.addEventListener("click", function () {
          menu.classList.toggle("active");
        });

        menuClose.addEventListener("click", function () {
          menu.classList.remove("active");
        });
      }

      // Smooth scroll
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();

          document.querySelector(this.getAttribute('href')).scrollIntoView({
            behavior: 'smooth'
          });
        });
      });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>


</body>
