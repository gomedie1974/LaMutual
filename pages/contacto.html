    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    

  <script>
  const miform = document.getElementById('form');
  const cbuInput = document.getElementById('cbuInput');
  const charCount = document.getElementById('charCount');
  const errorCBU = document.getElementById('errorCBU');
  const camposAyuda = document.getElementById('campos-ayuda');
  const selectTema = document.querySelector('select[name="tema"]');

  // Mostrar/ocultar campos según el tema
  selectTema.addEventListener('change', function () {
    if (this.value === 'Ayuda Económica') {
      camposAyuda.style.display = 'block';
    } else {
      camposAyuda.style.display = 'none';
      errorCBU.style.display = 'none';
    }
  });

  // Validación de input CBU en tiempo real
  cbuInput.addEventListener('input', function () {
    const value = cbuInput.value.replace(/\D/g, '');
    cbuInput.value = value;
    charCount.textContent = `${value.length}/22`;
    charCount.style.color = value.length === 22 ? 'green' : 'gray';

    if (value.length === 22) {
      errorCBU.style.display = 'none';
    }
  });

  // NO dejar salir del campo CBU hasta que tenga 22 dígitos
  cbuInput.addEventListener('blur', function () {
    if (selectTema.value === 'Ayuda Económica') {
      const value = cbuInput.value.trim();
      if (value.length !== 22 || !/^\d{22}$/.test(value)) {
        errorCBU.textContent = "⚠️ El CBU debe tener exactamente 22 números.";
        errorCBU.style.display = 'block';
        setTimeout(() => {
          cbuInput.focus(); // Devuelve el foco al campo
        }, 50);
      }
    }
  });

  // Validación final al enviar
miform.addEventListener('submit', function (e) {
  e.preventDefault(); // Siempre prevenir el envío predeterminado

  const tema = selectTema.value;
  const cbuFieldVisible = camposAyuda.style.display === 'block'; // ¿Está visible el campo CBU?
  const cbu = cbuFieldVisible ? cbuInput.value.trim() : '';

  // Validar CBU solo si está visible y es requerido
  if (cbuFieldVisible) {
    if (cbu.length !== 22 || !/^\d{22}$/.test(cbu)) {
      errorCBU.textContent = "⚠️ El CBU debe contener exactamente 22 números.";
      errorCBU.style.display = "block";
      cbuInput.focus();
      return; // Cancelar envío
    } else {
      errorCBU.style.display = "none";
    }
  }

  // Enviar formulario manualmente con fetch a Formspree
  const formData = new FormData(miform);

  fetch("https://formspree.io/f/maykebag", {
    method: "POST",
    body: formData,
    headers: {
      'Accept': 'application/json'
    }
  })
  .then(response => {
    if (response.ok) {
      // ✅ Mostrar mensaje de éxito
      document.getElementById("mensajeExito").style.display = "block";

      // Redirigir luego de 2.5s
      setTimeout(() => {
        window.location.href = "https://www.lnmutual.com.ar";
      }, 2500);
    } else {
      alert("❌ Hubo un error al enviar el formulario. Intente nuevamente.");
    }
  })
  .catch(error => {
    alert("❌ Error de conexión. Intente más tarde.");
  });
});

</script>

    });
